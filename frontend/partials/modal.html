<!--------------------------------------------------------------------------->
<!-- Modal Entrar/Cadastrar -->
<!--------------------------------------------------------------------------->
<div id="authModal" class="auth-modal">
  <div class="auth-modal-content split-modal">

    <span class="close-modal">&times;</span>

    <!-- Lado esquerdo: imagem -->
    <div class="modal-left">
      <img src="img/geral-site/modal.png" alt="Imagem" class="modal-image">
    </div>

    <!-- Lado direito: formulários -->
    <div class="modal-right">

      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Entrar</button>
        <button class="tab-btn" data-tab="register">Cadastrar</button>
      </div>

      <form id="loginForm" class="modal-form active">
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Senha" required>
        <div class="form-extra">
          <label>
            <input type="checkbox"> Manter conectado
          </label>
          <a href="#" class="recover-link">Recuperar senha?</a>
        </div>
        <button type="submit" class="btn-custom">Entrar</button>
        <p id="loginFeedback" class="form-description" aria-live="polite"></p>
      </form>

      <form id="registerForm" class="modal-form">
        <input id="registerName" type="text" placeholder="Nome completo" required>
        <input id="registerCpf" type="text" placeholder="CPF (somente numeros)" required>
        <input id="registerEmail" type="email" placeholder="Email" required>
        <input id="registerPassword" type="password" placeholder="Senha" required>
        <div class="form-extra">
          <label>
            <input type="checkbox"> Manter conectado
          </label>
        </div>
        <button type="submit" class="btn-custom">Cadastrar</button>
        <p id="registerFeedback" class="form-description" aria-live="polite"></p>
      </form>

      <form id="recoverForm" class="modal-form">
        <h3 class="form-title">Recuperar Senha</h3>
        <p class="form-description">Insira seu e-mail abaixo para receber as instruções de como criar uma nova senha.
        </p>
        <input id="recoverEmail" type="email" placeholder="Email" required>
        <button type="submit" class="btn-custom">Enviar link</button>
        <p id="recoverFeedback" class="form-description" aria-live="polite"></p>
        <a href="#" class="back-to-login-link">Voltar para o login</a>
      </form>

    </div>

  </div>
</div>
