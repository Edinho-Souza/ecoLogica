<div id="authModal" class="auth-modal">
  <div class="auth-modal-content split-modal">

    <span class="close-modal">&times;</span>

    <div class="modal-left">
      <img src="img/geral-site/modal.png" alt="Imagem" class="modal-image">
    </div>

    <div class="modal-right">

      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Entrar</button>
        <button class="tab-btn" data-tab="register">Cadastrar</button>
      </div>

      <form id="loginForm" class="modal-form active">
        <input type="email" id="email" placeholder="Email" required>
        
        <input type="password" id="password" placeholder="Senha" required>
        
        <div class="form-extra">
          <label>
            <input type="checkbox"> Manter conectado
          </label>
          <a href="#" class="recover-link">Recuperar senha?</a>
        </div>
        <button type="submit" class="btn-custom">Entrar</button>
      </form>

      <form id="registerForm" class="modal-form">
        <input type="text" id="reg-nome" placeholder="Nome completo" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Senha" required>
        
        <div class="form-extra">
          <label>
            <input type="checkbox"> Manter conectado
          </label>
        </div>
        <button type="submit" class="btn-custom">Cadastrar</button>
      </form>

      <form id="recoverForm" class="modal-form">
        <h3 class="form-title">Recuperar Senha</h3>
        <p class="form-description">Insira seu e-mail abaixo para receber as instruções de como criar uma nova senha.
        </p>
        <input type="email" id="recover-email" placeholder="Email" required>
        <button type="submit" class="btn-custom">Enviar link</button>
        <a href="#" class="back-to-login-link">Voltar para o login</a>
      </form>

    </div>

  </div>
</div>
