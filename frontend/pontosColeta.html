<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Pontos de Coleta | ecoLogica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="img/geral-site/logo-aba-navegador.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/mapa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

</head>

<body>

    <div id="site-announcement-container"></div>
    <header id="placeholder-header"></header>

    <main>
        <div id="placeholder-menu"></div>
        <div id="placeholder-banner"></div>

        <div id="site-ad-banner-container" class="container text-center mt-4 mb-4" style="display: none;">
        </div>

        <section class="container my-5">
            <div class="text-center mb-4">
                <h2 class="display-5 fw-bold">Pontos de coleta</h2>
                <p>Veja no mapa os locais de reciclagem mais próximos de você.</p>

            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                    <label for="cidade-select" class="form-label">Selecione sua cidade:</label>
                    <select class="form-select" id="cidade-select">
                        <option value="todos">Mostrar todas as cidades</option>
                        <option value="blumenau">Blumenau</option>
                        <option value="timbo">Timbó</option>
                        <option value="indaial">Indaial</option>
                        <option value="pomerode">Pomerode</option>
                        <option value="gaspar">Gaspar</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="material-select" class="form-label">Selecione o tipo de material:</label>
                    <select class="form-select" id="material-select">
                        <option value="todos">Mostrar todos os materiais</option>
                        <option value="eletronicos">Eletrônicos</option>
                        <option value="metal">Metal</option>
                        <option value="oleo">Óleo de Cozinha Usado</option>
                        <option value="papel">Papel/Papelão</option>
                        <option value="plastico">Plástico</option>
                        <option value="vidro">Vidro</option>
                    </select>
                </div>
            </div>

            <div id="mapa">
                <div class="legenda-mapa">
                    <h4>Legenda</h4>

                    <div class="legenda-item" data-type="eletronicos">
                        <span class="cor-legenda" style="background-color: #007bff;"></span> Eletrônicos
                    </div>
                    <div class="legenda-item" data-type="metal">
                        <span class="cor-legenda" style="background-color: #dc3545;"></span> Metal
                    </div>
                    <div class="legenda-item" data-type="oleo">
                        <span class="cor-legenda" style="background-color: #ffc107;"></span> Óleo de Cozinha Usado
                    </div>
                    <div class="legenda-item" data-type="papel">
                        <span class="cor-legenda" style="background-color: #28a745;"></span> Papel/Papelão
                    </div>
                    <div class="legenda-item" data-type="plastico">
                        <span class="cor-legenda" style="background-color: #dc3545;"></span> Plástico
                    </div>
                    <div class="legenda-item" data-type="vidro">
                        <span class="cor-legenda" style="background-color: #28a745;"></span> Vidro
                    </div>
                </div>
            </div>

        </section>

        <div id="placeholder-imagem-rodape"></div>
        <div id="placeholder-redesocial"></div>
    </main>

    <footer id="placeholder-rodape"></footer>

    <div id="placeholder-modal"></div>
    <div id="placeholder-botao-topo"></div>

    <script src="js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
    <script src="js/mapa.js"></script>

</body>

</html>
