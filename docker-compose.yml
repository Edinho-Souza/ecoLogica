services:
  mysql:
    image: mysql:8.4
    container_name: ecologica-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecologica
    ports:
      - "3306:3306"
    volumes:
      - ecologica_mysql_data:/var/lib/mysql
      - ./database/dumps/Create_Database_ecoLogica.sql:/docker-entrypoint-initdb.d/01-create-ecologica.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ecologica_mysql_data:
